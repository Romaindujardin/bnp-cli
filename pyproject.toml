[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bnp-cli"
version = "0.2.0"
description = "Unofficial read-only BNP Paribas CLI: Enable Banking PSD2 or direct web session, accounts and transactions as JSON."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Romain Dujardin" }]
keywords = ["bnp", "bnp-paribas", "enable-banking", "psd2", "banking", "cli", "json", "direct-access"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "cryptography>=42",
]

[project.optional-dependencies]
direct = [
  "curl-cffi>=0.17",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "build>=1.2",
  "twine>=5",
]

[project.scripts]
bnp-cli = "bnp_sidecar.cli:main"
bnp-sidecar = "bnp_sidecar.cli:main"
bnp-direct = "bnp_sidecar.direct.cli:main"

[project.urls]
Homepage = "https://github.com/Romaindujardin/bnp-cli"
Repository = "https://github.com/Romaindujardin/bnp-cli"
Issues = "https://github.com/Romaindujardin/bnp-cli/issues"
Changelog = "https://github.com/Romaindujardin/bnp-cli/blob/main/CHANGELOG.md"
Security = "https://github.com/Romaindujardin/bnp-cli/security/policy"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["bnp_sidecar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: tests hitting a real network endpoint (disabled by default)",
  "real: tests using a real Enable Banking session (disabled by default)",
]
